  - { desc: "rest of the day unaccounted in the journal; the Sunday list intended a post for Monday, a 'last week in AI' article, and a Daylens weekly checklist (incl. One Acre Fund meeting prep) — none confirmed done" }
notes: >
  The journal is a 4 a.m. reflection with no timeline for the day itself.
  Capture starts at 08:05 (the 4 a.m. writing was never observed) and totals
  only ~6.3h, with large unexplained holes (~13:00–15:00, ~17:20–22:00).
  Whatever Daylens shows for the daytime cannot be checked against the
  journal — judge the shape very leniently and do not treat the daytime
  holes as declared gaps. Do punish inventing a story the journal
  contradicts, e.g. claiming the week plan was written midday.
