primaryWork:
  - name: Weekly planning / journal self-review
    aliases: [journal, planning, weekly plan, self-review, reflection]
secondary:
  - name: Last week in AI article (intended, unconfirmed)
    aliases: [last week in ai, article]
  - name: Daylens weekly checklist (intended, unconfirmed)
    aliases: [daylens]
