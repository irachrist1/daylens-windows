# Ground truth from the owner's Obsidian journal. This entry is a ~4 a.m.
# self-review and week plan, not a day log — activity facts are thin by design.
date: "2026-04-26"
confidence: journal
sources:
  - "Obsidian journal 2026-04-26 (early-morning self-review + weekly plan)"
summary: >
  Sunday. Woke around 4 a.m. and wrote a long journal entry: a personal
  audit and a full plan for the coming week — day-by-day task lists for
  Monday through Friday (Daylens work, running, morning learning, Andersen
  articles, IT audit checklist, training prep) plus rules like no screens
  past 10 p.m. The entry's Sunday list named three intentions: a post for
