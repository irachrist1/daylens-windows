  <circle cx="351.87" cy="351.87" r="27.36" fill="#68AEFF"/>
  <circle cx="440.38" cy="351.87" r="27.36" fill="#68AEFF"/>
  <circle cx="528.90" cy="351.87" r="27.36" fill="#68AEFF"/>
</svg>
